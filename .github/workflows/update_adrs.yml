name: Actualizar Datos ADRs (18:30 ART)
on:
schedule:
Lunes a Viernes a las 18:30 ART (America/Argentina/Buenos_Aires es UTC-3 -> 21:30 UTC)
cron: '30 21 * * 1-5'
Permite ejecutar la actualización manualmente en cualquier momento con un clic
workflow_dispatch:
permissions:
contents: write
jobs:
update-data:
runs-on: ubuntu-latest
    steps:
- name: Descargar repositorio
uses: actions/checkout@v4
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar datos de Yahoo Finance y recalcular métricas
        run: python actualizar\_datos.py

      - name: Guardar datos\_adrs.json actualizado en el repositorio
        run: |
          git config --local user.email "github-actions\[bot]@users.noreply.github.com"
          git config --local user.name "Monitor ADRs Bot"
          git add datos\_adrs.json
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos en datos\_adrs.json"
          else
            git commit -m "chore: actualización diaria ADRs $(date +'%Y-%m-%d')"
            git push
          fi
