steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Configurar Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'
      cache: 'pip'

  - name: Instalar dependencias
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Descargar datos de Yahoo Finance y recalcular métricas
    run: python actualizar_datos.py

  - name: Guardar datos_adrs.json actualizado en el repositorio
    run: |
      git config --local user.email "github-actions[bot]@users.noreply.github.com"
      git config --local user.name "Monitor ADRs Bot"
      git add datos_adrs.json
      if git diff --staged --quiet; then
        echo "Sin cambios nuevos en datos_adrs.json"
      else
        git commit -m "chore: actualizacion diaria ADRs"
        git push
      fi

